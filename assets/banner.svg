<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0c1427"/>
      <stop offset="100%" stop-color="#141029"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for soft neon glowing effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Dynamic Keyframe Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.75; stroke-dashoffset: -80; }
      }
      @keyframes waveMotion {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -360; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes cardBob1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes cardBob2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
      }
      @keyframes pillPulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6)); }
      }

      .floating-bg1 { animation: floatSlow 8s ease-in-out infinite; transform-origin: center; }
      .floating-bg2 { animation: floatReverse 10s ease-in-out infinite; transform-origin: center; }
      .pulse-wire { stroke-dasharray: 12, 12; animation: waveMotion 16s linear infinite; }
      .ambient-glow { animation: pulseBeam 6s ease-in-out infinite; }
      .card-1 { animation: cardBob1 5s ease-in-out infinite; }
      .card-2 { animation: cardBob2 6.5s ease-in-out infinite; }
      .pill-elem { animation: pillPulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep canvas background -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <g class="floating-bg1" opacity="0.45">
    <circle cx="150" cy="80" r="140" fill="url(#accentGlow)"/>
    <circle cx="1060" cy="270" r="160" fill="url(#accentGlow)"/>
  </g>

  <!-- Dynamic Sine/Spring Physics Flow Curves -->
  <g class="pulse-wire" opacity="0.35">
    <path d="M-50,280 C200,200 350,330 600,260 C850,190 1000,320 1250,240" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#subtleGlow)"/>
    <path d="M-50,120 C250,180 400,60 680,140 C950,210 1050,90 1250,150" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="8, 8"/>
    <path d="M-50,220 C220,290 420,170 700,230 C980,290 1080,180 1250,210" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="14, 10"/>
  </g>

  <!-- Interactive/Motion Visual Cards on Right (positioned away from central text) -->
  <g transform="translate(860, 48)" class="card-1">
    <rect width="280" height="110" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="10" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <rect x="52" y="24" width="80" height="12" rx="4" fill="#64748b" opacity="0.6"/>
    <rect x="22" y="54" width="236" height="6" rx="3" fill="#1e293b"/>
    <!-- Animated Spring Progress Bar -->
    <rect x="22" y="54" width="168" height="6" rx="3" fill="url(#titleGrad)">
      <animate attributeName="width" values="40;210;140;180" dur="5s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="74" width="70" height="18" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="57" y="87" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">SPRING 120 FPS</text>
    <rect x="100" y="74" width="80" height="18" rx="4" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
    <text x="140" y="87" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">STATE MACHINE</text>
  </g>

  <g transform="translate(890, 185)" class="card-2">
    <rect width="250" height="96" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="28" r="8" fill="#ec4899" filter="url(#subtleGlow)"/>
    <rect x="48" y="23" width="90" height="10" rx="3" fill="#64748b" opacity="0.6"/>
    <!-- Simulated Keyframe Timeline Dots -->
    <line x1="24" y1="58" x2="226" y2="58" stroke="#334155" stroke-width="2"/>
    <circle cx="45" cy="58" r="5" fill="#38bdf8"/>
    <circle cx="110" cy="58" r="5" fill="#818cf8"/>
    <circle cx="170" cy="58" r="5" fill="#c084fc"/>
    <circle cx="215" cy="58" r="6" fill="#ec4899" filter="url(#subtleGlow)">
      <animate attributeName="cx" values="170;220;120;215" dur="7s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="80" fill="#94a3b8" font-size="10" font-weight="500">Ease: cubic-bezier(0.16, 1, 0.3, 1)</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (High Contrast & Clear Hierarchy) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)" class="pill-elem">
      <rect width="320" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="5" fill="#22c55e" filter="url(#subtleGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="19" fill="#c7d2fe" font-size="11.5" font-weight="700" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#titleGrad)" font-size="40" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome UI Animation
    </text>
    <text x="0" y="178" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Motion Design Libraries
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="222" fill="#94a3b8" font-size="15" font-weight="400">
      Declarative Animation Engines • Spring Physics • Micro-Interactions • Vector &amp; Lottie Runtimes
    </text>

    <!-- Interactive Badges Row -->
    <g transform="translate(0, 258)">
      <rect x="0" y="0" width="112" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="56" y="19" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">⚡ 60/120 FPS</text>

      <rect x="122" y="0" width="136" height="30" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="190" y="19" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">🌀 Spring Physics</text>

      <rect x="268" y="0" width="138" height="30" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="337" y="19" fill="#e879f9" font-size="12" font-weight="700" text-anchor="middle">🎬 Lottie &amp; Rive</text>

      <rect x="416" y="0" width="130" height="30" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="481" y="19" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">🎨 Open Source</text>
    </g>
  </g>
</svg>